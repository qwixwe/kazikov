<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kazikov Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0f0c29;
      --bg-mid: #302b63;
      --bg-light: #24243e;
      --accent: #ff2a75;
      --accent-glow: rgba(255, 42, 117, 0.5);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light));
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff2a75, #ff8a00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .user-info h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .user-info p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    .balance-card {
      background: linear-gradient(135deg, rgba(255, 42, 117, 0.2), rgba(255, 138, 0, 0.2));
      border: 1px solid rgba(255, 42, 117, 0.3);
      text-align: center;
      padding: 30px 20px;
    }

    .balance-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 10px;
    }

    .balance-amount {
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 20px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .balance-currency {
      font-size: 24px;
      color: var(--accent);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      outline: none;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.95);
    }

    .btn-icon {
      font-size: 24px;
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--accent), #ff8a00);
      border: none;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-primary:active {
      box-shadow: 0 2px 5px var(--accent-glow);
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Профиль -->
    <div class="card profile-header">
      <div class="avatar" id="avatar">👤</div>
      <div class="user-info">
        <h2 id="username">Загрузка...</h2>
        <p id="userid">ID: ...</p>
      </div>
    </div>

    <!-- Баланс -->
    <div class="card balance-card">
      <div class="balance-label">Ваш баланс</div>
      <div class="balance-amount" id="balance">
        <span class="loader" id="loader"></span>
      </div>
    </div>

    <!-- Кнопки -->
    <div class="btn-grid">
      <button class="btn" onclick="sendAction('games')">
        <span class="btn-icon">🎲</span>
        Игры
      </button>
      <button class="btn" onclick="sendAction('roulette')">
        <span class="btn-icon">🎡</span>
        Рулетка
      </button>
      <button class="btn" onclick="sendAction('profile')">
        <span class="btn-icon">👤</span>
        Профиль
      </button>
      <button class="btn" onclick="sendAction('top')">
        <span class="btn-icon">🏆</span>
        Топ
      </button>
    </div>

    <button class="btn btn-primary" onclick="sendAction('bonus')" style="width: 100%; padding: 20px;">
      <span class="btn-icon">🎁</span>
      Забрать бонус
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Красим хедер в цвет фона
    tg.setHeaderColor('#0f0c29');
    tg.setBackgroundColor('#0f0c29');

    const user = tg.initDataUnsafe?.user;

    // Инициализация профиля
    if (user) {
      document.getElementById('username').textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '');
      document.getElementById('userid').textContent = 'ID: ' + user.id;
      document.getElementById('avatar').textContent = user.first_name.charAt(0).toUpperCase();
    } else {
      document.getElementById('username').textContent = 'Гость';
      document.getElementById('userid').textContent = 'Войдите через Telegram';
    }

    // Имитация загрузки баланса (в будущем тут будет запрос к боту)
    setTimeout(() => {
      const balanceEl = document.getElementById('balance');
      balanceEl.innerHTML = '<span>10 000</span><span class="balance-currency">💰</span>';
    }, 1000);

    // Функция отправки данных боту
    function sendAction(action) {
      // Вибрация при нажатии (если поддерживается)
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
      
      // Отправляем данные в бота
      tg.sendData(JSON.stringify({ action: action }));
    }
  </script>
</body>
</html>
